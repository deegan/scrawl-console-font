# Scrawl console font settings for foot.
#
# This is a fixed-size 16px bitmap font, so:
#   - pixelsize must stay 16 (there is no other embedded size).
#   - dpi-aware=yes is required, otherwise foot multiplies pixelsize by
#     the output's scale factor (e.g. 16 * 1.25 = 20px) and the bitmap
#     gets blurrily upscaled to a non-native size.
#
# To use via `include=` instead of scrawl-font-setup-foot, add this line
# under [main] in ~/.config/foot/foot.ini, AFTER any existing font= line
# (foot uses the last-seen value of a key, so ordering matters):
#
#   include=/usr/share/scrawl-console-font/foot-scrawl.ini
#
# and merge the [tweak] section below into your own if you already have one
# (foot does not merge duplicate section headers from separate files).

[main]
font=ScrawlS:pixelsize=16
dpi-aware=yes

[tweak]
# Silences a harmless false-positive from foot's monospace sanity check.
font-monospace-warn=no
